<!DOCTYPE html>
<html>
<head>
  <title>Astra AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: rgba(255,255,255,0.05);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #60a5fa;
    }

    .menu div {
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu div:hover {
      background: #1e293b;
    }

    .owner {
      margin-top: auto;
      font-size: 13px;
      opacity: 0.8;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* HERO */
    .hero {
      height: 180px;
      background: url('https://images.unsplash.com/photo-1604079628048-94301bb21b91?q=80&w=1200') center/cover;
      display: flex;
      align-items: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    /* CHAT */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .msg {
      margin: 10px;
      padding: 12px;
      border-radius: 12px;
      max-width: 70%;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: #1e293b;
    }

    /* INPUT */
    .inputArea {
      display: flex;
      padding: 10px;
      background: #020617;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      margin-left: 5px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    /* RIGHT PANEL */
    .right {
      width: 260px;
      background: rgba(255,255,255,0.05);
      padding: 15px;
      backdrop-filter: blur(10px);
    }

    .card {
      background: #1e293b;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .quick button {
      width: 100%;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">🚀 Astra AI</div>

  <div class="menu">
    <div>💬 Chat</div>
    <div>🔍 Research</div>
    <div>🧮 Calculator</div>
    <div>📰 News</div>
  </div>

  <div class="owner">
    👑 Owner: Anand <br>
    🛠 Developed by <br> Sajalanand Group
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="hero">
    Welcome Explorer 🌌
  </div>

  <div id="chat"></div>

  <div class="inputArea">
    <input id="input" placeholder="Ask Astra anything..." />
    <button onclick="send()">Send</button>
    <button onclick="startVoice()">🎤</button>
  </div>

</div>

<!-- RIGHT PANEL -->
<div class="right">

  <div class="card">
    🤖 Astra Online
  </div>

  <div class="card quick">
    ⚡ Quick Actions
    <button onclick="quick('research AI')">Research</button>
    <button onclick="quick('latest AI news')">News</button>
    <button onclick="quick('2+2*10')">Calculate</button>
  </div>

  <div class="card">
    🌟 “The universe is within your questions.”
  </div>

</div>

<script>
const API = "https://astra-backend-tuuv.onrender.com/chat";

let sessionId = localStorage.getItem("sessionId") || null;

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const res = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-session-id": sessionId || ""
    },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  sessionId = res.headers.get("x-session-id");
  localStorage.setItem("sessionId", sessionId);

  addMessage(data.reply, "bot");
}

/* QUICK BUTTONS */
function quick(text){
  document.getElementById("input").value = text;
  send();
}

/* VOICE */
function startVoice(){
  const r = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  r.onresult = e => {
    document.getElementById("input").value = e.results[0][0].transcript;
    send();
  };
  r.start();
}
</script>

</body>
  </html>
