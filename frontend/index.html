<!DOCTYPE html>
<html>
<head>
  <title>Astra AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; font-family: Arial; background:#0f172a; color:white; }
    h2 { text-align:center; padding:10px; }
    #chat { height:75vh; overflow-y:auto; padding:10px; }
    .msg { margin:10px; padding:10px; border-radius:10px; max-width:70%; white-space:pre-wrap; }
    .user { background:#2563eb; margin-left:auto; }
    .bot { background:#1e293b; }
    #inputArea { display:flex; padding:10px; background:#020617; }
    input { flex:1; padding:10px; border-radius:5px; border:none; }
    button { margin-left:5px; padding:10px; border:none; cursor:pointer; border-radius:5px; }
  </style>
</head>
<body>

<h2>🚀 Astra AI</h2>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="Type or speak..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>
  <button onclick="stopVoice()">⏹</button>
</div>

<script>
const API = "https://astra-backend-tuuv.onrender.com/chat";

let sessionId = localStorage.getItem("sessionId") || null;

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-session-id": sessionId || ""
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    sessionId = res.headers.get("x-session-id");
    localStorage.setItem("sessionId", sessionId);

    addMessage(data.reply, "bot");
    speak(data.reply);

  } catch {
    addMessage("⚠️ Error connecting to Astra.", "bot");
  }
}

let recognition;

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById("input").value = text;
    send();
  };

  recognition.start();
}

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
}

function stopVoice() {
  speechSynthesis.cancel();
}
</script>

</body>
</html>
