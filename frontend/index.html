<!DOCTYPE html>
<html>
<head>
  <title>Astra AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      max-width: 75%;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: #2563eb;
      align-self: flex-end;
    }

    .bot {
      background: #1e293b;
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
    }

    button {
      margin-left: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .avatar {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>🚀 Astra AI</header>

<div id="chat"></div>

<div class="avatar">🤖</div>

<div id="inputArea">
  <input id="input" placeholder="Ask Astra anything..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>
  <button onclick="stopVoice()">⏹</button>
</div>

<script>
const API = "YOUR-RENDER-URL/chat";

let sessionId = localStorage.getItem("sessionId") || null;

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.id = "typing";
  div.innerText = "Astra is thinking...";
  document.getElementById("chat").appendChild(div);
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  showTyping();

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-session-id": sessionId || ""
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    sessionId = res.headers.get("x-session-id");
    localStorage.setItem("sessionId", sessionId);

    removeTyping();
    addMessage(data.reply, "bot");

    speak(data.reply);

  } catch {
    removeTyping();
    addMessage("⚠️ Connection error.", "bot");
  }
}

/* 🎤 Voice */
let recognition;

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";

  recognition.onresult = (e) => {
    document.getElementById("input").value = e.results[0][0].transcript;
    send();
  };

  recognition.start();
}

/* 🔊 Voice Output */
function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
}

function stopVoice() {
  speechSynthesis.cancel();
}
</script>

</body>
</html>
